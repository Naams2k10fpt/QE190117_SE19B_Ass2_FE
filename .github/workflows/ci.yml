name: Frontend CI

on:
  push: {}
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Dependency security check
      run: npm audit

    - name: Auth client checks
      run: npm test

    - name: Typecheck and Build Next.js
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5117

    - name: Deploy tested main to Vercel
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      run: >-
        node -e 'fetch(process.env.VERCEL_DEPLOY_HOOK, {method:"POST"}).then(r => {if (!r.ok) throw Error();}).catch(() => {console.error("Vercel deployment request failed.");process.exit(1);})'
